name: Community Import Tool

on:
  push:
    branches: [main]
    paths:
      - "tools/community-import/**"
      - "docs/guides/COMMUNITY_IMPORT.md"
      - "Makefile"
      - ".github/workflows/community-import.yml"
  pull_request:
    paths:
      - "tools/community-import/**"
      - "docs/guides/COMMUNITY_IMPORT.md"
      - "Makefile"
      - ".github/workflows/community-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: make community-import-test
