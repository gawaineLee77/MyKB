services:
  frontend:
    image: ${MINDCREEK_UI_IMAGE:-mindcreek-ui:phase4}
    build:
      context: ../..
      dockerfile: images/mindcreek-ui/Dockerfile
      args:
        MINDCREEK_UI_VERSION: ${MINDCREEK_UI_VERSION:-0.5.0}
        VITE_FRONTEND_COMMIT: weknora-${WEKNORA_VERSION:-v0.7.2}-mindcreek-${MINDCREEK_UI_VERSION:-0.5.0}
    container_name: MindCreek-frontend

  app:
    container_name: MindCreek-app
    env_file: !override
      - ../../.local/mindcreek.env

  docreader:
    container_name: MindCreek-docreader

  postgres:
    container_name: MindCreek-postgres

  redis:
    container_name: MindCreek-redis

  mock-embedding:
    container_name: MindCreek-mock-embedding
