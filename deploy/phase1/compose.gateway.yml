services:
  frontend:
    environment:
      APP_HOST: gateway
      APP_PORT: "8080"
      APP_SCHEME: http
    depends_on: !override
      gateway:
        condition: service_healthy

  gateway:
    image: ${MINDCREEK_GATEWAY_IMAGE:-mindcreek-gateway:phase3}
    build:
      context: ../..
      dockerfile: images/mindcreek-gateway/Dockerfile
      args:
        MINDCREEK_VERSION: ${MINDCREEK_VERSION:-0.4.0-phase3}
    container_name: MindCreek-gateway
    environment:
      MINDCREEK_LISTEN_ADDR: ":8080"
      MINDCREEK_VERSION: ${MINDCREEK_VERSION:-0.4.0-phase3}
      MINDCREEK_UPSTREAM_URL: http://app:8080
      MINDCREEK_UPSTREAM_VERSION: ${WEKNORA_VERSION:-v0.7.2}
      MINDCREEK_UPSTREAM_TIMEOUT: ${MINDCREEK_UPSTREAM_TIMEOUT:-5s}
      MINDCREEK_ROUTE_POLICY_FILE: /etc/mindcreek/phase1-route-policy.json
      MINDCREEK_ROUTE_ACTIONS_FILE: /etc/mindcreek/phase2-route-actions.json
      MINDCREEK_CAPABILITIES_FILE: /etc/mindcreek/phase3-capabilities.json
      MINDCREEK_DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT:-5432}/${DB_NAME}?sslmode=disable
    volumes:
      - ../../config/phase1-route-policy.json:/etc/mindcreek/phase1-route-policy.json:ro
      - ../../config/phase2-route-actions.json:/etc/mindcreek/phase2-route-actions.json:ro
      - ../../config/phase3-capabilities.json:/etc/mindcreek/phase3-capabilities.json:ro
    expose:
      - "8080"
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - WeKnora-network
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  app:
    ports: !override []
